<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>
    <ion-title>My Profile</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="!isEditing" (click)="isEditing = true">
        <ion-icon name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="profile-container">
    
    <!-- Profile Section -->
    <ion-card class="profile-card">
      <ion-card-header>
        <div class="profile-header">
          <div class="avatar">
            <ion-icon name="person"></ion-icon>
          </div>
          <div class="profile-info">
            <h2>{{ userProfile.name }}</h2>
            <p>{{ userProfile.passengerType }} Passenger</p>
            <!-- Verification Badge -->
            <ion-chip *ngIf="userProfile.idVerified" color="success">
              <ion-icon name="checkmark-circle-outline"></ion-icon>
              <ion-label>ID Verified</ion-label>
            </ion-chip>
          </div>
        </div>
      </ion-card-header>

      <ion-card-content>
        <form>
          <ion-list [inset]="true">
            <ion-item>
              <ion-icon name="person-outline" slot="start"></ion-icon>
              <ion-input
                label="Full Name"
                labelPlacement="floating"
                [(ngModel)]="userProfile.name"
                [readonly]="!isEditing"
                name="name"
                placeholder="Enter your full name">
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-icon name="mail-outline" slot="start"></ion-icon>
              <ion-input
                label="Email or Student email for discount"
                labelPlacement="floating"
                type="email"
                [(ngModel)]="userProfile.email"
                [readonly]="isEditing"
                name="email"
                placeholder="Enter your email">
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-icon name="call-outline" slot="start"></ion-icon>
              <ion-input
                label="Phone Number"
                labelPlacement="floating"
                type="tel"
                [(ngModel)]="userProfile.phone"
                [readonly]="isEditing"
                name="phone"
                placeholder="Enter your phone number">
              </ion-input>
            </ion-item>

            <ion-item>
              <ion-icon name="people-outline" slot="start"></ion-icon>
              <ion-select
                label="Passenger Type"
                labelPlacement="floating"
                [(ngModel)]="userProfile.passengerType"
                [disabled]="!isEditing"
                name="passengerType"
                interface="action-sheet">
                <ion-select-option value="Regular">Regular</ion-select-option>
                <ion-select-option value="Student">Student</ion-select-option>
                <ion-select-option value="Senior">Senior Citizen</ion-select-option>
                <ion-select-option value="PWD">PWD</ion-select-option>
              </ion-select>
            </ion-item>

            <!-- ID Number (if verified) -->
            <ion-item *ngIf="userProfile.idNumber">
              <ion-icon name="card-outline" slot="start"></ion-icon>
              <ion-input
                label="ID Number"
                labelPlacement="floating"
                [(ngModel)]="userProfile.idNumber"
                [readonly]="true"
                name="idNumber">
              </ion-input>
            </ion-item>
          </ion-list>

          <!-- ID Verification Section -->
          <div class="id-verification-section" *ngIf="userProfile.passengerType === 'Regular'">
            <ion-item lines="none" *ngIf="!userProfile.idVerified">
              <ion-icon name="alert-circle-outline" slot="start" color="warning"></ion-icon>
              <ion-label class="ion-text-wrap">
                <h3>Verify Your ID</h3>
                <p>Scan your PWD, Senior Citizen, or Student ID to get discounts</p>
              </ion-label>
            </ion-item>

            <ion-button
              expand="block"
              color="secondary"
              (click)="showIdScanner = true"
              *ngIf="!userProfile.idVerified">
              <ion-icon name="scan" slot="start"></ion-icon>
              Scan ID for Verification
            </ion-button>

            <!-- Re-verify button if already verified -->
            <ion-button 
              expand="block" 
              fill="outline"
              color="medium"
              (click)="showIdScanner = true"
              *ngIf="userProfile.idVerified">
              <ion-icon name="refresh" slot="start"></ion-icon>
              Update ID Verification
            </ion-button>
          </div>

          <div *ngIf="isEditing" class="action-buttons">
            <ion-button expand="block" (click)="saveProfile()">
              <ion-icon name="checkmark" slot="start"></ion-icon>
              Save Profile
            </ion-button>
            <ion-button expand="block" fill="outline" (click)="isEditing = false">
              Cancel
            </ion-button>
          </div>
        </form>
      </ion-card-content>
    </ion-card>

    <!-- Save / Logout -->
    <div class="bottom-actions">
      <ion-button expand="block" (click)="saveProfile()">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        Save Profile
      </ion-button>
      <ion-button expand="block" fill="outline" color="danger" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Logout
      </ion-button>
    </div>

  </div>

  <!-- ID Scanner Overlay -->
  <div class="scanner-overlay" *ngIf="showIdScanner">
    <div class="scanner-backdrop" (click)="showIdScanner = false"></div>
    <div class="scanner-sheet">
      <app-id-scanner
        [userId]="userProfile.id"
        [visible]="showIdScanner"
        (scanComplete)="onIdScanComplete($event)"
        (close)="showIdScanner = false"
      ></app-id-scanner>
    </div>
  </div>
</ion-content>
